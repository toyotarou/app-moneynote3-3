// android/build.gradle

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { sub ->
    // isar_flutter_libs 用 namespace 補完
    if (sub.name == "isar_flutter_libs") {
        sub.afterEvaluate {
            if (sub.plugins.hasPlugin("com.android.library")) {
                sub.android { namespace "com.github.isar_flutter_libs" }
            }
        }
    }
}

subprojects { sub ->
    if (sub.name == "isar_flutter_libs") {
        sub.afterEvaluate {
            def mf = file("${sub.projectDir}/src/main/AndroidManifest.xml")
            if (mf.exists()) {
                mf.text = mf.text.replace('package="dev.isar.isar_flutter_libs"', '')
            }
        }
    }
}

rootProject.buildDir = "../build"

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 35
                // AGP 8.11 の最低要件が 35.0.0 のため（34 のままだと無視され警告が出る）
                buildToolsVersion "35.0.0"
            }
        }
        if (project.hasProperty("android")) {
            project.android {
                if (namespace == null) namespace project.group
            }
        }
    }
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// android/build.gradle

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { sub ->
    // isar_flutter_libs 用 namespace 補完
    if (sub.name == "isar_flutter_libs") {
        sub.afterEvaluate {
            if (sub.plugins.hasPlugin("com.android.library")) {
                sub.android { namespace "com.github.isar_flutter_libs" }
            }
        }
    }
}

subprojects { sub ->
    if (sub.name == "isar_flutter_libs") {
        sub.afterEvaluate {
            def mf = file("${sub.projectDir}/src/main/AndroidManifest.xml")
            if (mf.exists()) {
                mf.text = mf.text.replace('package="dev.isar.isar_flutter_libs"', '')
            }
        }
    }
}

rootProject.buildDir = "../build"

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                // 依存ライブラリ（androidx.core 1.18 等）が API 36 以上を要求するため
                compileSdkVersion 36
                // AGP 9.0 の最低要件が 36.0.0 のため（これより低いと無視され警告が出る）
                buildToolsVersion "36.0.0"
            }
        }
        if (project.hasProperty("android")) {
            project.android {
                if (namespace == null) namespace project.group
            }
        }
    }
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Flutter 標準テンプレートと同じ：プラグインより先に :app を評価する
// （名前順で :app より前に評価されるプラグイン（android_file_picker 等）が flutter 拡張を参照できず失敗するため）
subprojects {
    project.evaluationDependsOn(":app")
}
